server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: team-todo-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:todolist_db}?useUnicode=true&characterEncoding=utf8&useSSL=${DB_SSL:false}&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  migrate-only: ${APP_MIGRATE_ONLY:false}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:development-only-secret-change-me-before-production-123456}
    cookie-name: ${APP_AUTH_COOKIE_NAME:TODO_SESSION}
    session-hours: ${APP_AUTH_SESSION_HOURS:12}
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:false}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:管理员}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    member-usernames: ${APP_BOOTSTRAP_MEMBER_USERNAMES:member1,member2,member3,member4}
    member-password: ${APP_BOOTSTRAP_MEMBER_PASSWORD:ChangeMe123!}
