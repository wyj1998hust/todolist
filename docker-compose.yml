services:
  # 数据库服务 (本地开发使用 MySQL 代替 TDSQL)
  db:
    image: mysql:8.0
    container_name: todolist-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todolist_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  # 后端 API 服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: my-todolist-backend:latest
    container_name: todolist-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: todolist_db
    depends_on:
      - db
    restart: always

  # 前端 Web 服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-todolist-frontend:latest
    container_name: todolist-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
