# Copy to secret.yaml, replace all placeholder values, then apply it to the same namespace.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-internal
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_WITH_TDSQL_PASSWORD
  APP_AUTH_JWT_SECRET: REPLACE_WITH_A_RANDOM_32_BYTE_OR_LONGER_SECRET
  APP_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_INITIAL_ADMIN_PASSWORD
  APP_BOOTSTRAP_MEMBER_PASSWORD: REPLACE_WITH_INITIAL_MEMBER_PASSWORD
